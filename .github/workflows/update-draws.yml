name: Update Michigan draw results

on:
  schedule:
    # GitHub cron is UTC only and does NOT follow daylight saving, so each
    # target time is listed twice — once for EDT (UTC-4), once for EST (UTC-5).
    # Michigan posts midday results ~1:15-1:30pm ET, evening ~7:45-8pm ET.
    # Runs that find nothing new exit in seconds and cost nothing.
    - cron: '35 17 * * *'   # 1:35pm EDT  (12:35pm EST)
    - cron: '35 18 * * *'   # 2:35pm EDT  ( 1:35pm EST)  — EST catch-up / EDT retry
    - cron: '5 0 * * *'     # 8:05pm EDT  ( 7:05pm EST)
    - cron: '5 1 * * *'     # 9:05pm EDT  ( 8:05pm EST)  — EST catch-up / EDT retry
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

# Two runs pushing to main at once causes a non-fast-forward rejection and the
# scraped draws are lost. Serialize instead: a queued run waits for the active
# one rather than racing it.
concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Pull latest draws
        run: node scrape.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/mi-draws.json)" ]]; then
            git config user.name  "playslip-bot"
            git config user.email "actions@github.com"
            git add data/mi-draws.json
            git commit -m "Update Michigan draw results ($(date -u +%Y-%m-%d))"

            # The scrape takes ~3 minutes. If anything else pushed to main in
            # that window, a plain `git push` is rejected non-fast-forward and
            # the draws we just collected are discarded. Rebase onto whatever
            # landed, then retry a few times before giving up.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
              git pull --rebase --autostash origin main || exit 1
              sleep 5
            done

            echo "Could not push after 3 attempts."
            exit 1
          else
            echo "No changes to commit."
          fi
